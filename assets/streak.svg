<svg width="100%" height="195" viewBox="0 0 420 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="streakBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <style>
      .streak-flame {
        animation: flamePulse 2s ease-in-out infinite alternate;
        transform-origin: 210px 65px;
      }
      .streak-glow {
        animation: glowCycle 3s ease-in-out infinite alternate;
      }
      @keyframes flamePulse {
        0% { transform: scale(0.92); opacity: 0.8; }
        100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes glowCycle {
        0% { filter: drop-shadow(0 0 3px #34d399); }
        100% { filter: drop-shadow(0 0 8px #34d399); }
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="1" y="1" width="418" height="193" rx="12" fill="url(#streakBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Column 1: Total Contributions -->
  <g transform="translate(70, 75)">
    <text x="0" y="0" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">287</text>
    <text x="0" y="24" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Total Contributions</text>
    <text x="0" y="44" fill="#64748b" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Sep 2025 - Present</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="140" y1="40" x2="140" y2="155" stroke="#21262d" stroke-width="1.5"/>

  <!-- Column 2: Current Streak (Center Highlight) -->
  <g transform="translate(210, 0)">
    <!-- Animated Flame Vector Icon -->
    <g class="streak-flame" transform="translate(0, 48)">
      <circle cx="0" cy="0" r="19" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Pure vector flame path -->
      <path d="M0 -10 C3 -4 6 -2 6 3 C6 7 3 10 0 10 C-3 10 -6 7 -6 3 C-6 0 -3 -4 0 -10 Z" fill="url(#flameGrad)"/>
    </g>

    <text class="streak-glow" x="0" y="105" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">2</text>
    <text x="0" y="128" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Current Streak</text>
    <text x="0" y="148" fill="#64748b" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Sep 19 - Present</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="280" y1="40" x2="280" y2="155" stroke="#21262d" stroke-width="1.5"/>

  <!-- Column 3: Longest Streak -->
  <g transform="translate(350, 75)">
    <text x="0" y="0" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">7</text>
    <text x="0" y="24" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Longest Streak</text>
    <text x="0" y="44" fill="#64748b" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Sprint Cycles</text>
  </g>
</svg>
