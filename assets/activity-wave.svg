<svg width="100%" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Radar scan line -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <style>
      .pulse-dot-anim {
        animation: dotGlow 2.5s ease-in-out infinite alternate;
      }
      .scanner {
        animation: scanMove 6s linear infinite;
      }
      .activity-path {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawPath 3s ease-out forwards;
      }

      @keyframes dotGlow {
        0% { r: 3.5px; opacity: 0.6; }
        100% { r: 6px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes scanMove {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateX(780px); opacity: 0; }
      }
      @keyframes drawPath {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="218" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="1" y="1" width="848" height="34" rx="12" fill="#161b22"/>
  <line x1="1" y1="35" x2="849" y2="35" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="4" fill="#34d399"/>
  <text x="32" y="22" fill="#8b949e" font-family="'Fira Code', Consolas, monospace" font-size="11">COMMIT VELOCITY // REAL-TIME ACTIVITY WAVE</text>

  <!-- Metric Quick Stats Inside Card -->
  <text x="560" y="22" fill="#94a3b8" font-family="'Fira Code', Consolas, monospace" font-size="11">Frequency: <tspan fill="#38bdf8">Optimal</tspan> | Status: <tspan fill="#34d399">Continuous</tspan></text>

  <!-- Background Horizontal Gridlines -->
  <line x1="35" y1="70" x2="815" y2="70" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="35" y1="110" x2="815" y2="110" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="35" y1="150" x2="815" y2="150" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="35" y1="190" x2="815" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Filled Area Wave -->
  <path d="M35 148 Q 87.5 148 140 151 Q 200 151 260 165 Q 320 165 380 159 Q 440 159 500 120 Q 560 120 620 118 Q 717.5 118 815 70 L815 190 L35 190 Z" fill="url(#waveGrad)"/>

  <!-- Wave Stroke -->
  <path class="activity-path" d="M35 148 Q 87.5 148 140 151 Q 200 151 260 165 Q 320 165 380 159 Q 440 159 500 120 Q 560 120 620 118 Q 717.5 118 815 70" stroke="url(#strokeGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Key Activity Data Nodes -->
  <g class="pulse-dot-anim">
    <circle cx="35" cy="148" r="4" fill="#38bdf8"/>
    <circle cx="140" cy="151" r="4" fill="#818cf8"/>
    <circle cx="260" cy="165" r="4" fill="#38bdf8"/>
    <circle cx="380" cy="159" r="4" fill="#818cf8"/>
    <circle cx="500" cy="120" r="4" fill="#38bdf8"/>
    <circle cx="620" cy="118" r="4" fill="#818cf8"/>
    <circle cx="815" cy="70" r="4" fill="#38bdf8"/>
  </g>

  <!-- Moving Radar Scanner Line -->
  <line class="scanner" x1="35" y1="36" x2="35" y2="190" stroke="url(#scanGrad)" stroke-width="2"/>

  <!-- Month X-Labels -->
  <text x="35" y="206" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="10">SEP</text>
  <text x="160" y="206" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="10">NOV</text>
  <text x="290" y="206" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="10">JAN</text>
  <text x="420" y="206" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="10">FEB</text>
  <text x="550" y="206" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="10">APR</text>
  <text x="680" y="206" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="10">JUN</text>
  <text x="795" y="206" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="10">NOW</text>
</svg>