<svg width="100%" height="185" viewBox="0 0 850 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <style>
      .bar-progress {
        animation: expandBar 1.6s ease-out forwards;
      }
      @keyframes expandBar {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="1" y="1" width="848" height="183" rx="12" fill="url(#langCardBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="32" y="32" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">Top Programming Languages</text>

  <!-- Multi-Segmented Progress Bar -->
  <g transform="translate(32, 48)" class="bar-progress" style="transform-origin: 32px 48px;">
    <!-- Background track -->
    <rect x="0" y="0" width="786" height="10" rx="5" fill="#21262d"/>
    <!-- TypeScript (56.0%) -->
    <rect x="0" y="0" width="440" height="10" rx="5" fill="#3178c6"/>
    <!-- JavaScript (25.8%) -->
    <rect x="440" y="0" width="203" height="10" fill="#f1e05a"/>
    <!-- Python (9.8%) -->
    <rect x="643" y="0" width="77" height="10" fill="#3572A5"/>
    <!-- HTML (3.3%) -->
    <rect x="720" y="0" width="26" height="10" fill="#e34c26"/>
    <!-- CSS (2.1%) -->
    <rect x="746" y="0" width="17" height="10" fill="#563d7c"/>
    <!-- Java (1.7%) -->
    <rect x="763" y="0" width="13" height="10" rx="5" fill="#b07219"/>
  </g>

  <!-- Language Details Grid -->
  <!-- TypeScript -->
  <g transform="translate(32, 90)">
    <circle cx="6" cy="6" r="5" fill="#3178c6"/>
    <text x="20" y="10" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">TypeScript</text>
    <text x="110" y="10" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">56.0%</text>
  </g>
  <!-- JavaScript -->
  <g transform="translate(290, 90)">
    <circle cx="6" cy="6" r="5" fill="#f1e05a"/>
    <text x="20" y="10" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">JavaScript</text>
    <text x="120" y="10" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">25.8%</text>
  </g>
  <!-- Python -->
  <g transform="translate(560, 90)">
    <circle cx="6" cy="6" r="5" fill="#3572A5"/>
    <text x="20" y="10" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Python</text>
    <text x="120" y="10" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">9.8%</text>
  </g>
  <!-- HTML -->
  <g transform="translate(32, 130)">
    <circle cx="6" cy="6" r="5" fill="#e34c26"/>
    <text x="20" y="10" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">HTML</text>
    <text x="110" y="10" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">3.3%</text>
  </g>
  <!-- CSS -->
  <g transform="translate(290, 130)">
    <circle cx="6" cy="6" r="5" fill="#563d7c"/>
    <text x="20" y="10" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CSS</text>
    <text x="120" y="10" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">2.1%</text>
  </g>
  <!-- Java -->
  <g transform="translate(560, 130)">
    <circle cx="6" cy="6" r="5" fill="#b07219"/>
    <text x="20" y="10" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Java</text>
    <text x="120" y="10" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">1.7%</text>
  </g>
</svg>