<svg width="100%" height="300" viewBox="0 0 850 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term-text {
        font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 13px;
      }
      .cursor-blink {
        animation: blinkCursor 1s step-end infinite;
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Outer Container -->
  <rect x="1" y="1" width="848" height="298" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M1 13C1 6.37258 6.37258 1 13 1H837C843.627 1 849 6.37258 849 13V38H1V13Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>

  <!-- Tab Label -->
  <rect x="90" y="8" width="220" height="22" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="104" cy="19" r="3.5" fill="#238636"/>
  <text x="116" y="23" fill="#8b949e" font-family="'Fira Code', monospace" font-size="11">zsh — selorm@core ~ </text>

  <!-- Line 1: Command -->
  <text class="term-text" x="28" y="70">
    <tspan fill="#58a6ff" font-weight="600">selorm@cloud</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#7ee787">~/profile</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">cat developer_info.json</tspan>
  </text>

  <!-- Line 2: Identity -->
  <text class="term-text" x="42" y="105">
    <tspan fill="#79c0ff" font-weight="500">&gt; Identity:        </tspan><tspan fill="#7ee787">"Selorm Tetteh-Abotsi"</tspan>
  </text>

  <!-- Line 3: Core Focus -->
  <text class="term-text" x="42" y="135">
    <tspan fill="#79c0ff" font-weight="500">&gt; Core Focus:      </tspan><tspan fill="#c9d1d9">Full-Stack Engineering, Cloud Systems &amp; Distributed Architecture</tspan>
  </text>

  <!-- Line 4: Current Pursuits -->
  <text class="term-text" x="42" y="165">
    <tspan fill="#79c0ff" font-weight="500">&gt; Mission:         </tspan><tspan fill="#c9d1d9">Engineering resilient backend microservices &amp; dynamic frontend experiences</tspan>
  </text>

  <!-- Line 5: Code Philosophy -->
  <text class="term-text" x="42" y="195">
    <tspan fill="#79c0ff" font-weight="500">&gt; Philosophy:      </tspan><tspan fill="#7ee787">"Engineered for performance, crafted for precision, built to scale."</tspan>
  </text>

  <!-- Line 6: Collaboration -->
  <text class="term-text" x="42" y="225">
    <tspan fill="#79c0ff" font-weight="500">&gt; Collaboration:   </tspan><tspan fill="#38bdf8">[Open Source]</tspan> <tspan fill="#818cf8">[Cloud-Native]</tspan> <tspan fill="#34d399">[Full-Stack Innovation]</tspan>
  </text>

  <!-- Line 7: Next Prompt + Blinking Cursor -->
  <text class="term-text" x="28" y="265">
    <tspan fill="#58a6ff" font-weight="600">selorm@cloud</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#7ee787">~/profile</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">init --deploy-future</tspan>
  </text>
  
  <!-- Cursor -->
  <rect class="cursor-blink" x="382" y="252" width="9" height="16" fill="#58a6ff"/>
</svg>
