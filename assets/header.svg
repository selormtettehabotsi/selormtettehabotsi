<svg width="100%" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Aurora Glow Filters -->
    <filter id="auroraBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>

    <radialGradient id="aurora1" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora2" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .glow-blob1 {
        animation: floatA 9s ease-in-out infinite alternate;
      }
      .glow-blob2 {
        animation: floatB 11s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: radarRing 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        transform-origin: 52px 42px;
      }
      .pulse-core {
        animation: corePulse 2.4s ease-in-out infinite;
      }
      .shine-text {
        animation: textShine 6s ease-in-out infinite alternate;
      }

      @keyframes floatA {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 20px) scale(1.15); }
      }
      @keyframes floatB {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-25px, -15px) scale(1.1); }
      }
      @keyframes radarRing {
        0% { r: 4px; opacity: 0.9; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes corePulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.5; }
      }
      @keyframes textShine {
        0% { filter: drop-shadow(0 0 2px rgba(96,165,250,0.2)); }
        100% { filter: drop-shadow(0 0 12px rgba(96,165,250,0.6)); }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="848" height="258" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Animated Glowing Aurora Blobs -->
  <g filter="url(#auroraBlur)">
    <circle class="glow-blob1" cx="80" cy="50" r="140" fill="url(#aurora1)"/>
    <circle class="glow-blob2" cx="750" cy="200" r="160" fill="url(#aurora2)"/>
    <circle cx="480" cy="80" r="120" fill="url(#aurora3)"/>
  </g>

  <!-- Tech Grid Overlay -->
  <rect x="1" y="1" width="848" height="258" rx="16" fill="url(#gridPattern)" />

  <!-- STATUS BADGE -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Radar animation ring -->
    <circle class="pulse-ring" cx="16" cy="16" r="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <circle class="pulse-core" cx="16" cy="16" r="4" fill="#34d399"/>
    <text x="32" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ACTIVE // OPEN TO WORK</text>
  </g>

  <!-- TERMINAL DIR BADGE -->
  <g transform="translate(620, 26)">
    <rect x="0" y="0" width="194" height="32" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Terminal icon -->
    <path d="M14 11L19 16L14 21" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="22" y1="21" x2="28" y2="21" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="36" y="20" fill="#94a3b8" font-family="'Fira Code', Consolas, monospace" font-size="11">~/selorm/workspace</text>
  </g>

  <!-- MAIN TITLE & IDENTITY -->
  <text class="shine-text" x="36" y="125" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">SELORM TETTEH-ABOTSI</text>
  
  <text x="36" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Software Engineer &amp; <tspan fill="#38bdf8" font-weight="600">Full-Stack Architect</tspan>
  </text>

  <!-- BOTTOM METRICS BAR -->
  <line x1="36" y1="195" x2="814" y2="195" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Pill 1: Full-Stack Systems -->
  <g transform="translate(36, 212)">
    <path d="M6 14L1 9L6 4" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 4L17 9L12 14" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="13" fill="#cbd5e1" font-family="'Fira Code', Consolas, monospace" font-size="12">Full-Stack Systems</text>
  </g>

  <circle cx="230" cy="221" r="2.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Pill 2: Cloud & APIs -->
  <g transform="translate(254, 212)">
    <rect x="0" y="2" width="16" height="6" rx="1.5" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="11" width="16" height="6" rx="1.5" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="3.5" cy="5" r="0.75" fill="#818cf8"/>
    <circle cx="3.5" cy="14" r="0.75" fill="#818cf8"/>
    <text x="24" y="13" fill="#cbd5e1" font-family="'Fira Code', Consolas, monospace" font-size="12">Cloud &amp; Microservices</text>
  </g>

  <circle cx="468" cy="221" r="2.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Pill 3: Scalable Architectures -->
  <g transform="translate(492, 212)">
    <polygon points="8 1 15 5 15 13 8 17 1 13 1 5" stroke="#34d399" stroke-width="1.5" fill="none"/>
    <line x1="8" y1="1" x2="8" y2="17" stroke="#34d399" stroke-width="1"/>
    <line x1="1" y1="5" x2="15" y2="13" stroke="#34d399" stroke-width="1"/>
    <text x="24" y="13" fill="#cbd5e1" font-family="'Fira Code', Consolas, monospace" font-size="12">Scalable Architectures</text>
  </g>

  <circle cx="710" cy="221" r="2.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Pill 4: Clean Code -->
  <g transform="translate(734, 212)">
    <path d="M12 2L3 7L12 12L21 7L12 2Z" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="13" fill="#cbd5e1" font-family="'Fira Code', Consolas, monospace" font-size="12">Precision</text>
  </g>
</svg>
